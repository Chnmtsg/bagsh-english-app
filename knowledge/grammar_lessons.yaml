# Expanded grammar lessons — one real lesson per taxonomy category.
# Curated from knowledge/contrastive-guide.md (see guide_ref in the
# taxonomy). Owned by linguistics-curator; the PWA and lesson renderers
# consume this verbatim — models never author lesson content.
#
# explain_b1: English-first, 3–5 sentences.
# explain_a2: mostly Mongolian, 1–3 short sentences.
# ⚠ Mongolian strings need native-speaker verification before shipping.

version: 1

lessons:
  copula:
    explain_b1: >-
      English never drops the verb "to be". Mongolian says "Би багш" —
      two words, no verb — and it is a complete sentence. English cannot do
      this: every sentence needs a verb, so you must add am/is/are. Notice
      that "I am a teacher" needs TWO additions: the verb "am" AND the
      article "a". This one four-word sentence contains the two biggest
      differences between your languages.
    explain_a2: >-
      Монголоор "Би багш" гэж хэлдэг — үйл үг хэрэггүй. Англиар үйл үг
      ЗААВАЛ хэрэгтэй: I am a teacher. "Am" болон "a" хоёуланг нь нэм.
    extra_examples:
      - {wrong: "She happy today.", right: "She is happy today."}
      - {wrong: "Dinner ready.", right: "Dinner is ready."}
      - {wrong: "My office small but warm.", right: "My office is small but warm."}
    how:
      - "Read your sentence. Where is the verb? No verb → add am/is/are."
      - "I → am · he/she/it/нэг юм → is · you/we/they/олон → are."
      - "Past: was (ганц тоо) / were (олон тоо)."
    watch_out: >-
      Questions with 'be' flip the order and need NO do: "Is she happy?" —
      never "Does she is happy?"
    tip: >-
      Present forms: I am · he/she/it is · you/we/they are. Past: was/were.

  word_order:
    explain_b1: >-
      Mongolian builds backwards; English builds forwards. In Mongolian
      everything that describes something comes BEFORE it, and the verb
      comes last: Би ном уншсан (I book read). English is the opposite:
      the verb comes right after the person, and descriptions usually come
      after the thing. One rule — subject, then verb, then object — fixes
      five different error types at once, so learn the principle, not five
      separate rules.
    explain_a2: >-
      Монгол хэл арагшаа барьдаг, англи хэл урагшаа барьдаг. Дараалал:
      ХЭН + ЮУ ХИЙСЭН + ЮУГ. I read a book.
    extra_examples:
      - {wrong: "I every day English study.", right: "I study English every day."}
      - {wrong: "We last week my parents visited.", right: "We visited my parents last week."}
      - {wrong: "He the report wrote.", right: "He wrote the report."}
    how:
      - "Start with WHO (the subject)."
      - "The verb comes SECOND — immediately after who."
      - "Then WHAT, then where, then when: I read the report at home yesterday."
    watch_out: >-
      Never put anything between the verb and its object — that slot is
      welded shut in English.
    tip: >-
      Basic shape: WHO + ACTION + WHAT (+ where + when). Time words go at
      the end or the very beginning — never in the middle.

  articles:
    explain_b1: >-
      Mongolian has no articles — but it DOES mark definiteness, with the
      accusative suffix -ыг/-ийг on specific objects. So you already have
      the concept; English just uses a separate word in front instead of a
      suffix behind. Use "a/an" for something new or general ("we found a
      nice café"), "the" for something both people know ("the café we
      found"), and nothing for general plurals and most names ("apples",
      "Mongolia"). "An" goes before a vowel SOUND: an hour, but a
      university.
    explain_a2: >-
      "Ном уншсан" (ямар ч ном) = a book. "Номыг уншсан" (тодорхой ном) =
      the book. -ыг гэдэг дагаврыг та мэднэ — англид "the" гэдэг үг урд нь
      ордог.
    extra_examples:
      - {wrong: "We found new café.", right: "We found a new café."}
      - {wrong: "I saw a rock. A rock was heavy.", right: "I saw a rock. The rock was heavy."}
      - {wrong: "He speaks the English.", right: "He speaks English."}
      - {wrong: "We meet twice the week.", right: "We meet twice a week."}
      - {wrong: "It was such long meeting.", right: "It was such a long meeting."}
      - {wrong: "I waited half hour at the gate.", right: "I waited half an hour at the gate."}
    how:
      - "Singular thing, new or general → a/an: a café, an idea."
      - "Both people know WHICH one → the: the café we found."
      - "General plurals and names → nothing: apples, Mongolia, English."
      - "a or an? Listen to the SOUND: an hour, but a university."
      - "Job, nationality, religion → a/an: she is a geologist, he is an Australian."
      - "How often, how much → a: twice a day, three times a year, 50,000 tugrik a tonne."
      - "After such / what / half / quite, a comes second: such a long meeting, half an hour."
    watch_out: >-
      The second mention flips to 'the': I saw a film. THE film was long.
    tip: >-
      Second mention becomes "the": a rock … the rock. Languages and
      countries take no article.

  verb_agreement:
    explain_b1: >-
      Mongolian verbs never change for WHO does the action — English verbs
      change in exactly one place: he/she/it adds -s in the present simple.
      "I work, you work, they work — but he workS." This is the most common
      error in English learning worldwide, and knowing the rule is not
      enough: it must become a reflex through repetition, because you will
      always be too busy thinking about your message to compute it.
    explain_a2: >-
      HE, SHE, IT → үйл үг дээр -s нэм: he works, she lives, it takes.
      Би, та, тэд нар → -s хэрэггүй.
    extra_examples:
      - {wrong: "My sister work in a bank.", right: "My sister works in a bank."}
      - {wrong: "My boss want the report.", right: "My boss wants the report."}
      - {wrong: "It rain a lot in July.", right: "It rains a lot in July."}
    how:
      - "Find the subject of the sentence."
      - "he / she / it / one person / one thing → verb + s."
      - "everyone, every X, my boss, the drill → also singular → + s."
      - "I / you / we / they → no s."
    watch_out: >-
      The negative moves the -s onto DO: he doesn't work (never "he don't"
      or "he doesn't works").
    tip: >-
      Chant it — "HE-SHE-IT adds S." It sounds childish. It works.

  plurals:
    explain_b1: >-
      In Mongolian, plural marking is optional, and after a numeral it is
      normally dropped — гурван ном, because "three" already says it. English
      repeats itself: three bookS, many sampleS, even when the number makes
      it obvious. This is not logical; it is simply obligatory. The one
      exception pattern: a number USED AS A DESCRIPTION stays singular —
      "a 500-metre road", "a three-day trip".
    explain_a2: >-
      Гурван ном = three bookS. Англи хэл давхардуулдаг: тоо байсан ч -s
      заавал нэм. Логикгүй ч дүрэм ийм.
    extra_examples:
      - {wrong: "We bought five ticket.", right: "We bought five tickets."}
      - {wrong: "Many student came.", right: "Many students came."}
      - {wrong: "a 500-metres road", right: "a 500-metre road"}
    how:
      - "Any number above one → noun + s: three tickets."
      - "many / several / a few → + s too."
      - "Number used as a DESCRIPTION before a noun → singular: a three-day trip."
    watch_out: >-
      Irregulars refuse -s: children, people, men, women, feet, teeth.
    tip: >-
      After every number bigger than one: -s. Before a noun ("500-metre
      road"): no -s.

  missing_subject:
    explain_b1: >-
      English cannot tolerate a sentence without a subject — so it invents
      fake ones. Nothing is actually raining, but English says "IT is
      raining". Nothing is "there" in "THERE are three cups" — the word
      just fills the subject seat. Mongolian happily drops the subject when
      it is obvious; English never does. When your sentence has no natural
      subject, reach for "it" (weather, time, distance) or "there is/are"
      (existence).
    explain_a2: >-
      Англи өгүүлбэрт эзэн ЗААВАЛ хэрэгтэй. "Бороо орж байна" → IT is
      raining. "Гурван аяга байна" → THERE are three cups.
    extra_examples:
      - {wrong: "Is raining today.", right: "It is raining today."}
      - {wrong: "Have three cups on the table.", right: "There are three cups on the table."}
      - {wrong: "Is important to check the data.", right: "It is important to check the data."}
    how:
      - "Sentence has no natural doer? Don't start with the verb."
      - "Weather / time / distance → IT: It is raining. It is late."
      - "Something exists → THERE is/are: There are three cups."
    watch_out: >-
      Match there is/are to the noun AFTER it: there IS a cup, there ARE
      three cups.
    tip: >-
      Weather, time, distance → "it". Existence → "there is / there are".

  topic_fronting:
    explain_b1: >-
      Mongolian is a topic language: you announce what you are talking
      about, then comment on it — "Тайлангийн тухай — оройтсон". English
      cannot announce a topic with "about". The best repair is to make the
      topic the SUBJECT: "The report is late." Not "About the report, it is
      late." If you truly need a topic opener, "As for the report…" exists,
      but making the topic the subject is what native writing does.
    explain_a2: >-
      "About X" гэж өгүүлбэр бүү эхэл. X-ийг өгүүлэгдэхүүн болго:
      "About the report, it is late" ❌ → "The report is late" ✅.
    extra_examples:
      - {wrong: "About my English, it is not good.", right: "My English is not good."}
      - {wrong: "About the meeting, it was long.", right: "The meeting was long."}
      - {wrong: "About this phone, the price is high.", right: "This phone has a high price."}
    how:
      - "Spot the pattern: your sentence starts with 'About X,'."
      - "Delete 'About'."
      - "Make X the subject and give it the verb: The report is late."
      - "Occasional formal alternative: 'As for X, …' — but repair #1 is better."
    watch_out: >-
      This habit returns every time you write about a NEW topic — that is
      normal, not failure. Re-apply the repair.
    tip: >-
      See "About X, …" in your writing? Delete "About", make X the subject.

  prepositions:
    explain_b1: >-
      Mongolian marks a noun's role with a suffix on the end (-д, -аас,
      -тай); English marks it with a small word in FRONT (at, in, on, to,
      from, with). Those small words feel unimportant to a Mongolian ear —
      but they ARE the case system. Deleting "at" from "at 6:30" is like
      deleting -д from "зургаан цагт". Learn preposition + noun as one
      chunk: at night, on Monday, in July, at the airport.
    explain_a2: >-
      -д, -аас, -тай гэдэг дагаврын ажлыг англид жижиг үгс хийдэг: at, in,
      on, to. Жижиг үгийг хаявал дагаврыг хаясантай адил.
    extra_examples:
      - {wrong: "We arrived the airport 8 o'clock.", right: "We arrived at the airport at 8 o'clock."}
      - {wrong: "I was born on July.", right: "I was born in July."}
      - {wrong: "It depends of the weather.", right: "It depends on the weather."}
    how:
      - "Learn preposition + noun as ONE word: at-night, on-Monday, in-July."
      - "Place ladder: AT a point → ON a surface → IN a space."
      - "Time ladder: AT a clock time → ON a day → IN a month/year."
      - "Verb pairs are chunks too: listen TO, depend ON, arrive AT."
    watch_out: >-
      No preposition before next/last/every/each + time: next week, each
      day (never "in each day").
    tip: >-
      Place ladder: AT a point (at the door) → ON a surface (on the table)
      → IN a space (in the office). Time: AT 6:30 → ON Monday → IN July.

  questions_negation:
    explain_b1: >-
      Mongolian makes a question with a particle at the end (уу/үү) and
      never changes word order. English inserts a helping verb instead —
      and one rule covers everything: find an auxiliary (am/is/can/have…);
      if there is one, move it to the front; if there is none, borrow DO.
      "You work here" has no auxiliary → "DO you work here?" The same DO
      carries negation: "I DON'T have time." And once a question sits
      inside a longer sentence it becomes a statement again: "Tell me where
      it IS", not "where is it".
    explain_a2: >-
      Асуулт: DO/DOES-ийг урд нь тавь — Do you work here? Үгүйсгэл:
      don't/doesn't — I don't have time. Хоёр удаа үгүйсгэж болохгүй.
    extra_examples:
      - {wrong: "Where you live?", right: "Where do you live?"}
      - {wrong: "She no like coffee.", right: "She doesn't like coffee."}
      - {wrong: "Tell me where is the bus stop.", right: "Tell me where the bus stop is."}
    how:
      - "Look for an auxiliary: am/is/are/can/have/will…"
      - "Found one → move it in front of the subject: Can you swim?"
      - "None → borrow DO/DOES/DID: Do you work here?"
      - "Negation uses the same borrowed DO: I don't have time."
      - "Question INSIDE a sentence → statement order returns: tell me where it IS."
    watch_out: >-
      After does/did the main verb returns to base form: Does she work?
      (never "Does she works?").
    tip: >-
      One rule: find the auxiliary → move it to the front → no auxiliary?
      borrow DO.

  tense_aspect:
    explain_b1: >-
      Mongolian -сан covers both "finished in the past" and "still matters
      now" — English splits them. Past simple is a DOT in the past: "I
      worked in Erdenet in 2019" (finished, disconnected). Present perfect
      is an ARROW touching today: "I have worked here since 2019" (still
      true). Seven trigger words choose the arrow about 80% of the time:
      since, for, already, yet, just, ever, never. Two more traps: stative
      verbs (know, want, need, like) never take -ing, and "will" never
      follows "if".
    explain_a2: >-
      Дууссан үйл = цэг: I workED (2019 онд). Одоог хүртэл үргэлжилж
      байгаа = сум: I HAVE workED here since 2019. Түлхүүр үгс: since, for,
      already, yet, just.
    extra_examples:
      - {wrong: "I am knowing the answer.", right: "I know the answer."}
      - {wrong: "If it will rain, we will stop.", right: "If it rains, we will stop."}
      - {wrong: "I already ate lunch, I eat at 12.", right: "I have already eaten lunch — I ate at 12."}
    how:
      - "Finished and disconnected? → past simple (a dot): I worked there in 2019."
      - "Started before, still true / matters now? → have + done (an arrow): I have worked here since 2019."
      - "Trigger words choose the arrow: since, for, already, yet, just, ever, never."
      - "After IF → present tense, never will: If it rains, we will stop."
    watch_out: >-
      Stative verbs never take -ing: know, want, need, like, believe,
      understand — "I am knowing" is impossible.
    tip: >-
      Draw the timeline: dot = past simple, arrow touching today = present
      perfect.

  verb_form:
    explain_b1: >-
      Mongolian stacks meaning into one word with suffixes; English spreads
      it across several small words — and each slot forces a verb form.
      After a modal: base form ("can swim", never "can to swim"). After
      did/didn't: base form ("didn't go", never "didn't went"). After
      have/has/had: third form ("have gone"). In the passive: third form
      ("was written"). After enjoy/finish/keep and after ANY preposition:
      -ing ("look forward to hearING").
    explain_a2: >-
      can/must/should + үндсэн хэлбэр: can swim. didn't + үндсэн хэлбэр:
      didn't go. have + 3-р хэлбэр: have gone.
    extra_examples:
      - {wrong: "She must to finish today.", right: "She must finish today."}
      - {wrong: "The report was wrote yesterday.", right: "The report was written yesterday."}
      - {wrong: "I finished to clean the kitchen.", right: "I finished cleaning the kitchen."}
    how:
      - "After can/must/should → base form: can swim."
      - "After did/didn't → base form: didn't go."
      - "After have/has/had → third form: have gone."
      - "In the passive → third form: was written."
      - "After enjoy/finish/keep and ANY preposition → -ing."
    watch_out: >-
      A bare -ing is not a verb: "we setting our plan" needs are — or must
      become "we set".
    tip: >-
      After a preposition, always -ing — the one rule with no exceptions.

  punctuation:
    explain_b1: >-
      Mongolian commas follow breath and rhythm; English commas follow
      GRAMMAR. The signature error is the comma splice: two complete
      sentences joined by a comma — "I'm tired, I'll stop." The test:
      cover the comma; if both halves are complete sentences, the comma is
      illegal. Four legal fixes: a full stop, a semicolon, a comma PLUS a
      joining word (and, but, so), or making one half depend on the other
      ("Because I'm tired, I'll stop").
    explain_a2: >-
      Хоёр бүтэн өгүүлбэрийг таслалаар холбож БОЛОХГҮЙ. "I'm tired, I'll
      stop" ❌ → "I'm tired. I'll stop." ✅
    extra_examples:
      - {wrong: "The results came back, the score is low.", right: "The results came back. The score is low."}
      - {wrong: "It was late, we kept walking.", right: "It was late, but we kept walking."}
      - {wrong: "The tickets, were booked Monday.", right: "The tickets were booked on Monday."}
    how:
      - "Cover the comma with a finger."
      - "Read each half alone. Both complete sentences? The comma is illegal."
      - "Fix 1: full stop. Fix 2: semicolon. Fix 3: comma + and/but/so."
      - "Fix 4: make one half depend: Because I'm tired, I'll stop."
    watch_out: >-
      'However' cannot glue sentences with commas — it needs a full stop
      or semicolon before it.
    tip: >-
      Cover-the-comma test: complete sentence + complete sentence → the
      comma is illegal.

  pronoun_gender:
    explain_b1: >-
      Mongolian «тэр» covers he, she, it and that — English forces the
      choice every single time. You already KNOW the rule; the error
      happens at speed, because your brain never had to make this choice
      before. That means re-reading the rule does nothing. Only fast,
      repeated practice makes the choice automatic: describe people around
      you in three-second bursts — my wife, SHE…; my boss, HE…
    explain_a2: >-
      «Тэр» = he (эрэгтэй), she (эмэгтэй), it (юм). Та дүрмийг мэднэ —
      асуудал нь хурд. Хурдан дасгал л засна.
    extra_examples:
      - {wrong: "My mother, he is a teacher.", right: "My mother — she is a teacher."}
      - {wrong: "My manager is kind. She is a good man.", right: "My manager is kind. He is a good man."}
      - {wrong: "The company changed his name.", right: "The company changed its name."}
    how:
      - "Female person → she / her. Male person → he / him."
      - "Thing, animal, company → it / its."
      - "Train SPEED, not knowledge: describe people around you in 3-second bursts."
      - "Re-check pronouns in sentence two and three — that's where they slip."
    watch_out: >-
      The first pronoun is usually right; the follow-up sentence is where
      «тэр» strikes. Proofread pronouns separately.
    tip: >-
      Speed drill: point at photos, say he/she in under 3 seconds each.

  register:
    explain_b1: >-
      Mongolian politeness lives in the pronoun: та vs чи, one word changes
      everything. English has no polite "you" — politeness moved into modal
      verbs and length: more words + more distance = more polite. "I want
      the report" is not rude in your head — you translated та correctly
      and the politeness got lost in transit. The ladder: I'd like → Could
      you…? → Would you mind…? → I was wondering whether you might…
      For work email, this matters more than perfect grammar.
    explain_a2: >-
      Та гэдэг үг англид байхгүй. Эелдэг байдал modal үйл үгэнд байдаг:
      "I want" ❌ → "I'd like" ✅. Хүсэлт: "Could you…?"
    extra_examples:
      - {wrong: "Send me the meeting notes.", right: "Could you send me the meeting notes?"}
      - {wrong: "I want a day off tomorrow.", right: "I'd like a day off tomorrow."}
      - {wrong: "Give me five minutes.", right: "Could you give me five minutes?"}
    how:
      - "Want something? → I'd like… (not I want)."
      - "Need someone to act? → Could you…?"
      - "Bigger favour → Would you mind + -ing…?"
      - "Email to a boss/client → one step politer than feels natural."
    watch_out: >-
      'Please' alone does not rescue a command — "Please send it" still
      orders. The magic is in Could/Would.
    tip: >-
      More words = more polite. Practise moving one request up and down
      the ladder.

  capitalization:
    explain_b1: >-
      Mongolian does not capitalise "би"; English ALWAYS capitalises "I" —
      alone, mid-sentence, everywhere. Also capitalised: languages and
      nationalities (English, Mongolian), days (Monday), months (July),
      and names. Small, mechanical, and instantly visible to any reader —
      an examiner notices a lowercase "i" before anything else on the page.
    explain_a2: >-
      "I" үргэлж том үсгээр. Хэлний нэр, гарагийн нэр, сарын нэр бас том:
      English, Monday, July.
    extra_examples:
      - {wrong: "i work on mondays.", right: "I work on Mondays."}
      - {wrong: "She speaks mongolian and russian.", right: "She speaks Mongolian and Russian."}
      - {wrong: "we start in september.", right: "We start in September."}
    how:
      - "I → always capital, everywhere in the sentence."
      - "Languages, nationalities, days, months, names → capital letter."
      - "Before sending, scan the text once ONLY for capitals."
    watch_out: >-
      Seasons stay small (summer, winter), and so do school subjects
      unless they are languages (maths, but English).
    tip: >-
      Before sending anything, scan once just for i / english / monday.

  countability:
    explain_b1: >-
      About fifteen English nouns are uncountable even though they FEEL
      countable: information, advice, equipment, furniture, news, research,
      evidence, knowledge, progress, work, money, traffic, weather,
      software, staff. They never take -s and never take "a". To count
      them, use a container: a PIECE of advice, THREE ITEMS of equipment,
      a lot of work. "News" looks plural but takes a singular verb: the
      news IS good.
    explain_a2: >-
      Эдгээр үгэнд -s хэзээ ч орохгүй: information, advice, equipment,
      money, work. Тоолохдоо: a piece of advice.
    extra_examples:
      - {wrong: "The equipments arrived.", right: "The equipment arrived."}
      - {wrong: "She gave me many advices.", right: "She gave me a lot of advice."}
      - {wrong: "The news are good.", right: "The news is good."}
    how:
      - "Memorise the 15: information, advice, equipment, furniture, news, research, evidence, knowledge, progress, work, money, traffic, weather, software, staff."
      - "Never a/an, never -s with them."
      - "Need to count? Use a container: a piece of advice, an item of equipment, three sums of money."
    watch_out: >-
      'News' looks plural but takes IS. 'Work' (ажил) is uncountable —
      'a work' means a work of art.
    tip: >-
      Memorise the list of 15 — reasoning will not help; they simply must
      be known.

  determiners:
    explain_b1: >-
      English allows only ONE central pointer word per noun: "the my
      report" is impossible — choose "my report" or "the report". "A my
      friend" becomes "a friend of mine". "Another" contains "an", so it
      takes a singular noun: another cup, but OTHER cups. "Every"
      also takes singular: every student KNOWS. And the apostrophe pair:
      its = possession, it's = it is.
    explain_a2: >-
      Нэг нэр үгэнд нэг л заагч үг: my report (the my report ❌).
      another + ганц тоо, other + олон тоо. it's = it is; its = эзэмшил.
    extra_examples:
      - {wrong: "The my colleague is here.", right: "My colleague is here."}
      - {wrong: "We need another chairs.", right: "We need other chairs."}
      - {wrong: "Its ready.", right: "It's ready."}
    how:
      - "One pointer word per noun: my report OR the report — never both."
      - "another + singular (another cup); other + plural (other cups)."
      - "every + singular noun + singular verb: every student knows."
      - "it's = it is; its = эзэмшил. Expand to test: 'it is ready' works → it's."
    watch_out: >-
      "a my friend" cannot be repaired with order — it becomes "a friend
      of mine".
    tip: >-
      it's ready = it IS ready. its name = түүний нэр.

  collocation:
    explain_b1: >-
      Words travel in fixed pairs, and the pairs do not survive
      translation: you MAKE a decision (not do), DO research (not make),
      rain is HEAVY (not strong), you TURN ON a light (not open). There is
      no rule — only memory, so learn them as chunks. A special trap list:
      verbs that take NO preposition at all — discuss, enter, approach,
      marry, lack, mention, answer, reach, join, affect, phone. "Discuss
      about it" ❌ → "discuss it" ✅.
    explain_a2: >-
      Үгс хосоороо явдаг: make a decision, do research, heavy rain, turn
      on the light. Дүрэм байхгүй — хосыг цээжил.
    extra_examples:
      - {wrong: "We did a plan for the trip.", right: "We made a plan for the trip."}
      - {wrong: "Let's discuss about the budget.", right: "Let's discuss the budget."}
      - {wrong: "There was a strong rain last night.", right: "There was heavy rain last night."}
    how:
      - "Learn verb + noun as ONE unit: make-a-decision, do-research."
      - "MAKE: decision, mistake, plan, progress, an effort."
      - "DO: research, homework, business, your best."
      - "No preposition after: discuss, enter, marry, answer, reach, phone."
    watch_out: >-
      Your instinct will translate the Mongolian pair word-for-word — and
      be wrong. Trust the memorised chunk, not the feeling.
    tip: >-
      Learn verb + noun as one word: "make-a-decision" is one unit.

  word_choice:
    explain_b1: >-
      Three traps. First, "thing/stuff" — the weakest nouns in English:
      always name the actual noun ("exercises", not "fitness things").
      Second, participial pairs: you are interestED (how you feel); the
      rock is interestING (what causes the feeling). "I am boring" says
      you make others sleep! Third, Russian loanwords that shifted meaning
      in Mongolian: магазин is a shop (not magazine), кабинет is an office
      (not cabinet).
    explain_a2: >-
      "Thing" гэхийн оронд жинхэнэ нэрийг хэл. interestED = сонирхож
      байгаа хүн; interestING = сонирхолтой юм. Магазин = shop!
    extra_examples:
      - {wrong: "I am boring in meetings.", right: "I am bored in meetings."}
      - {wrong: "I bought it in a magazine.", right: "I bought it in a shop."}
      - {wrong: "We did some data things.", right: "We cleaned and checked the data."}
    how:
      - "Caught yourself writing thing/stuff? Stop and name the real noun."
      - "Feeling inside a person → -ed: I am bored / interested / tired."
      - "The cause outside → -ing: The film is boring / interesting."
      - "Russian loanwords: double-check meaning before trusting them."
    watch_out: >-
      "I am boring" tells people YOU put them to sleep. One letter, big
      difference.
    tip: >-
      -ED = the person's feeling. -ING = the thing causing it.

  modifier_placement:
    explain_b1: >-
      In Mongolian, word order is free because suffixes mark each word's
      job; in English, position IS the job. Three placement rules: an
      adverb never sits between the verb and its object ("read the
      letter carefully", never "read carefully the letter"); frequency
      adverbs (always, never, often) go BEFORE a main verb but AFTER "be"
      ("I always check" / "I am always careful"); adjectives follow the
      order opinion–size–age–shape–colour–origin–material ("an old black
      wooden box").
    explain_a2: >-
      Үйл үг ба юуг нь хооронд нь үг бүү оруул: read the letter
      carefully. always/never → үндсэн үйл үгийн ӨМНӨ: I always check.
    extra_examples:
      - {wrong: "He checked quickly the readings.", right: "He quickly checked the readings."}
      - {wrong: "Always I start at seven.", right: "I always start at seven."}
      - {wrong: "a black old leather bag", right: "an old black leather bag"}
    how:
      - "Adverb wants in? Send it to the END or the FRONT — never between verb and object."
      - "always/never/often/usually → BEFORE the main verb: I always check."
      - "…but AFTER be: I am always careful."
      - "Adjectives queue: opinion–size–age–shape–colour–origin–material."
    watch_out: >-
      'Only' changes meaning with position: "Only I saw him" ≠ "I only saw
      him" ≠ "I saw only him".
    tip: >-
      Never between verb and object — that slot is sacred in English.

  comparatives:
    explain_b1: >-
      Mongolian compares with the ablative case: "надаас өндөр" (from-me
      tall). English needs TWO parts that always travel together: -er +
      than. "Bigger THAN that one" — never "-er" alone, never "more taller"
      (one comparative only). The length rule: one syllable → -er (deeper),
      three or more → more (more expensive), two syllables → messy, learn
      each word. Superlative: the + -est / the most.
    explain_a2: >-
      "Надаас өндөр" → taller THAN me. -er болон than хамт явдаг.
      "More taller" ❌ — зөвхөн нэг харьцуулалт.
    extra_examples:
      - {wrong: "This city is big from that one.", right: "This city is bigger than that one."}
      - {wrong: "The queue is more long.", right: "The queue is longer."}
      - {wrong: "He is tall than me.", right: "He is taller than me."}
    how:
      - "Count the syllables of the adjective."
      - "One → -er + than: deeper than."
      - "Three or more → more … than: more expensive than."
      - "Superlative: the -est / the most. Irregulars: good–better–best, bad–worse–worst."
    watch_out: >-
      Never stack: "more bigger" and "most best" are double comparatives —
      one marker only.
    tip: >-
      Short word → -er than. Long word → more … than. Never both.

  relative_clauses:
    explain_b1: >-
      Mongolian describes BEFORE the noun: "миний уншсан ном" (my-read
      book). English describes AFTER it: "the book THAT I READ". Build
      from two simple sentences: "I met a woman. She teaches maths." →
      "I met a woman who teaches maths." Who = people, which = things,
      that = both. The professional bonus: reduced relatives drop
      "that is/was" — "the photos taken yesterday", "the email sent this
      morning" — the key to clear formal writing.
    explain_a2: >-
      Монголоор тодорхойлолт нэрийн ӨМНӨ, англиар АРД нь: the book THAT I
      read. Хоёр энгийн өгүүлбэрээс эхэл.
    extra_examples:
      - {wrong: "The yesterday arrived equipment is broken.", right: "The equipment that arrived yesterday is broken."}
      - {wrong: "The us helping engineer left.", right: "The engineer who was helping us left."}
      - {wrong: "I read the you sent report.", right: "I read the report that you sent."}
    how:
      - "Write two short sentences: I met a woman. She teaches maths."
      - "Replace the repeated person/thing with who (people) or which/that (things)."
      - "Attach it AFTER the noun: the woman who teaches maths."
      - "Formal writing bonus: drop 'that is/was' — the email sent this morning."
    watch_out: >-
      After a comma, 'that' is forbidden — non-defining clauses take
      which/who: "The report, WHICH arrived late, …"
    tip: >-
      Stuck? Write two short sentences first, then join them with
      that/who/which.

  reported_speech:
    explain_b1: >-
      Three rules. Say vs tell: TELL needs a person ("he told ME"), SAY
      does not ("he said the price was low") — "he said me" is impossible.
      Backshift: reporting steps one tense back — "I am tired" becomes "he
      said he WAS tired". Reported questions lose their inversion and
      their question mark: "Where do you work?" becomes "He asked where I
      workED" — statement order, because it is no longer a question.
    explain_a2: >-
      tell + хүн: He told ME. say + үг: He said (that)… Асуултыг
      дамжуулахад дараалал энгийн болно: He asked where I worked.
    extra_examples:
      - {wrong: "She said me the plan.", right: "She told me the plan."}
      - {wrong: "He asked where did I study.", right: "He asked where I studied."}
      - {wrong: "He said he is tired yesterday.", right: "He said he was tired yesterday."}
    how:
      - "Person mentioned? → TELL: he told ME. No person? → SAY: he said (that)…"
      - "Shift the tense one step back: 'I am tired' → he said he WAS tired."
      - "Reported question → statement order, no question mark: he asked where I worked."
      - "Shift time words too: today → that day, tomorrow → the next day."
    watch_out: >-
      Still-true facts may keep their tense: "She said the Earth IS
      round" — backshift is a tool, not a prison.
    tip: >-
      Inside a sentence, a question becomes a statement — no inversion,
      no question mark.

  spelling:
    explain_b1: >-
      Mongolian Cyrillic is nearly one letter = one sound; English spelling
      is a 500-year-old fossil: through, though, thought, tough, thorough —
      the same -ough, five different sounds. So expect spelling errors on
      words you know perfectly BY EAR — that is normal, and native speakers
      misspell too. The practical rule: never learn a written word without
      its sound, and never learn a heard word without its spelling. They
      are two separate facts about every English word.
    explain_a2: >-
      Англи үгийн бичлэг дуудлагыг дагадаггүй. Шинэ үгийг сурахдаа бичлэг
      + дуудлага хоёуланг нь хамт сур.
    extra_examples:
      - {wrong: "I recieved the pakage.", right: "I received the package."}
      - {wrong: "The wether was terrible.", right: "The weather was terrible."}
      - {wrong: "We have alot of work.", right: "We have a lot of work."}
    how:
      - "Learn every new word TWICE: how it sounds + how it is written."
      - "Keep a personal traps list — your five worst words, checked before sending."
      - "In doubt? Look it up. English spelling is memory, not logic."
    watch_out: >-
      The classics: a lot (two words) · receive (i before e except after
      c) · which/witch · their/there/they're.
    tip: >-
      i before e except after c: receive, believe. And "a lot" is always
      two words.

  # ── Coverage-floor drill items (103–143) ─────────────────────────
  #
  # Why these exist: the §KK checklist is a list of the errors the guide
  # documents, not a practice syllabus, so its coverage is lopsided —
  # `articles` had 13 quiz items while `copula` (priority 1, blocking high)
  # had one, and `missing_subject`, `spelling` and `copula` had no checklist
  # entry at all. A category with one item cannot be spaced: the SRS shows it
  # once and never has anything to bring back.
  #
  # Floor: every category ≥ 4 items, priorities 1–6 ≥ 6.
  #
  # Curation rules for anything added here:
  #  - tier: contextual, no find/replace. These are drills, not matcher rules.
  #  - Exactly ONE natural repair. The learner types the full sentence and
  #    check_answer is an exact match — an item with two valid corrections
  #    marks correct English wrong (standing rule 4).
  #  - Short. The answer is typed on a phone; long sentences test typing.
  #  - General-audience content, no domain vocabulary.
  #  - Fresh sentences — never reuse a `wrong` string already in this file or
  #    in grammar_lessons.yaml `extra_examples`, or the lesson and the game
  #    show the learner the same line twice.


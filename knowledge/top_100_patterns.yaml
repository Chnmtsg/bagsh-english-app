# Top 100 patterns — the contrastive guide's master checklist (§KK), tiered.
#
# tier: deterministic — regex `find` fires with (near) zero false positives on
#         correct English. Validated by scripts/validate_patterns.py against
#         data/clean_english.txt: ANY hit on the clean corpus demotes the
#         pattern to contextual. A pattern earns deterministic status by being
#         incapable of being wrong, not by usually being right.
#       contextual   — real error type, but a regex would fire on correct
#         English. Left to the corrector (LLM) + tutor.
#       professional — register/technical-reporting items; excluded from the
#         journal app core (see taxonomy `excluded_from_journal_app`).
#
# Deterministic entries must round-trip: re.sub(find, replace, wrong) == right.
# case_sensitive defaults to false (compiled with IGNORECASE).
# Deterministic count: 64 (62 checklist + 2 bonus). Keep this in sync with
# tests/test_matcher.py.
#
# Ids 103+ are the COVERAGE FLOOR block (see the section header below): drill
# items added so the grammar game can recycle every category, not only the ones
# the §KK checklist happened to hit hard. They are contextual by construction —
# no `find`/`replace` — so the matcher, the 64-pattern contract and the
# false-positive budget are all untouched. The floor is enforced by
# tests/test_study_games.py::test_grammar_bank_meets_coverage_floor.

version: 1
source: "knowledge/contrastive-guide.md §KK"

patterns:

  # ── Articles (1–12) ──────────────────────────────────────────────

  - id: 1
    category: articles
    tier: deterministic
    severity: low
    wrong: "I am geologist."
    right: "I am a geologist."
    find: '\bI am (geologist|teacher|doctor|nurse|lawyer|journalist|miner|driver)\b'
    replace: 'I am a \1'
    case_sensitive: true
    explanation: "Job words need 'a': I am a geologist."
    guide_ref: "§KK 1, §1.3.7"

  - id: 2
    category: articles
    tier: deterministic
    severity: low
    wrong: "She is engineer."
    right: "She is an engineer."
    find: '\b(he|she) is (engineer|accountant|economist|architect)\b'
    replace: '\1 is an \2'
    explanation: "Job words need 'an' before a vowel sound: an engineer."
    guide_ref: "§KK 2, §M"

  - id: 3
    category: articles
    tier: deterministic
    severity: low
    wrong: "I work in mining industry."
    right: "I work in the mining industry."
    find: '\bin mining industry\b'
    replace: 'in the mining industry'
    explanation: "Industry names take 'the': the mining industry."
    guide_ref: "§KK 3, §M"

  - id: 4
    category: articles
    tier: contextual
    severity: low
    wrong: "We found new deposit."
    right: "We found a new deposit."
    explanation: "A new, countable thing needs 'a': a new deposit."
    guide_ref: "§KK 4, §M"

  - id: 5
    category: articles
    tier: contextual
    severity: low
    wrong: "The deposit is in Gobi."
    right: "The deposit is in the Gobi Desert."
    explanation: "Deserts take 'the': the Gobi Desert."
    guide_ref: "§KK 5, §M geographical names"

  - id: 6
    category: articles
    tier: deterministic
    severity: low
    wrong: "I live in the Mongolia."
    right: "I live in Mongolia."
    find: '\bin the (Mongolia|China|Russia|Japan|Korea|Germany|France|England|America|Australia|Canada)(?=\s*[.,!?;:]|$)'
    replace: 'in \1'
    explanation: "Country names take no article: in Mongolia."
    guide_ref: "§KK 6, §M geographical names"

  - id: 7
    category: articles
    tier: contextual
    severity: low
    wrong: "He speaks the English."
    right: "He speaks English."
    explanation: "Language names take no article: speaks English."
    guide_ref: "§KK 7, §M"

  - id: 8
    category: articles
    tier: deterministic
    severity: low
    wrong: "I go to the work at 8."
    right: "I go to work at 8."
    find: '\bgo(es|ing)? to the work(?= at \d|\s*[.,!?])'
    replace: 'go\1 to work'
    explanation: "Fixed phrase: go to work, no 'the'."
    guide_ref: "§KK 8, §M no-article list"

  - id: 9
    category: articles
    tier: contextual
    severity: low
    wrong: "The geology is interesting."
    right: "Geology is interesting."
    explanation: "A subject in general takes no article: Geology is interesting."
    guide_ref: "§KK 9, §M"

  - id: 10
    category: articles
    tier: deterministic
    severity: low
    wrong: "It took a hour."
    right: "It took an hour."
    find: '\ba (hour|honest|honour|honor)\b'
    replace: 'an \1'
    explanation: "'Hour' starts with a vowel SOUND, so: an hour."
    guide_ref: "§KK 10, §M a vs an"

  - id: 11
    category: articles
    tier: deterministic
    severity: low
    wrong: "She is an university student."
    right: "She is a university student."
    find: '\ban (universit|uniform|union|unique|united|European)'
    replace: 'a \1'
    explanation: "'University' starts with a /j/ sound, so: a university."
    guide_ref: "§KK 11, §M a vs an"

  - id: 12
    category: articles
    tier: contextual
    severity: low
    wrong: "I saw a rock. A rock was heavy."
    right: "I saw a rock. The rock was heavy."
    explanation: "Second mention becomes 'the': we both know which rock now."
    guide_ref: "§KK 12, §M six triggers for the"

  # ── Nouns and number (13–22) ─────────────────────────────────────

  - id: 13
    category: plurals
    tier: deterministic
    severity: low
    wrong: "We collected three sample."
    right: "We collected three samples."
    find: '\b(two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|\d+) (sample|hole|rock|book|report|test|question|lesson|word|sentence|mistake|hour|minute|month|student|teacher|friend|dog|cat|car|house)(?=\s*([.,!?;:]|and\b|or\b|but\b)|$)'
    replace: '\1 \2s'
    explanation: "After a number, add -s: three samples. English repeats itself."
    guide_ref: "§KK 13, §1.3.6"

  - id: 14
    category: countability
    tier: deterministic
    severity: low
    wrong: "many informations"
    right: "much information"
    find: '\bmany informations\b'
    replace: 'much information'
    explanation: "'Information' never takes -s: much information."
    guide_ref: "§KK 14, §N trap list"

  - id: 15
    category: countability
    tier: deterministic
    severity: low
    wrong: "We bought new equipments."
    right: "We bought new equipment."
    find: '\bequipments\b'
    replace: 'equipment'
    explanation: "'Equipment' never takes -s."
    guide_ref: "§KK 15, §N trap list"

  - id: 16
    category: countability
    tier: deterministic
    severity: low
    wrong: "He gave me an advice."
    right: "He gave me a piece of advice."
    find: '\ban advice\b'
    replace: 'a piece of advice'
    explanation: "'Advice' is uncountable: a piece of advice."
    guide_ref: "§KK 16, §N counting phrases"

  - id: 17
    category: countability
    tier: deterministic
    severity: low
    wrong: "The news are good."
    right: "The news is good."
    find: '\bnews are\b'
    replace: 'news is'
    explanation: "'News' looks plural but is singular: the news is good."
    guide_ref: "§KK 17, §N"

  - id: 18
    category: countability
    tier: contextual
    severity: low
    wrong: "I have many works."
    right: "I have a lot of work."
    explanation: "'Work' (ажил) is uncountable: a lot of work."
    guide_ref: "§KK 18, §N"

  - id: 19
    category: countability
    tier: deterministic
    severity: low
    wrong: "We did two researches."
    right: "We did two research projects."
    find: '\b(two|three|four|five|many|several|some) researches\b'
    replace: '\1 research projects'
    explanation: "'Research' is uncountable: count it with 'projects' or 'studies'."
    guide_ref: "§KK 19, §N"

  - id: 20
    category: countability
    tier: deterministic
    severity: low
    wrong: "The datas show a trend."
    right: "The data show a trend."
    find: '\bdatas\b'
    replace: 'data'
    explanation: "'Data' is already plural — never 'datas'."
    guide_ref: "§KK 20, §N note on data"

  - id: 21
    category: countability
    tier: contextual
    severity: low
    wrong: "The staffs were present."
    right: "The staff were present."
    explanation: "'Staff' is a group word — no -s."
    guide_ref: "§KK 21, §N trap list"

  - id: 22
    category: countability
    tier: contextual
    severity: low
    wrong: "The evidences suggest a fault."
    right: "The evidence suggests a fault."
    explanation: "'Evidence' never takes -s."
    guide_ref: "§KK 22, §N trap list"

  # ── Verbs and tense (23–40) ──────────────────────────────────────

  - id: 23
    category: verb_agreement
    tier: deterministic
    severity: low
    wrong: "He work here."
    right: "He works here."
    find: '(^|[.!?]\s+)(He|She|It) (work|live|come|know|want|need|like|make|take|think|write|read|play|walk|talk|look|seem|feel|eat|run|sleep|speak|drink|start|stay|help|call|tell|give|get|put|sit|stand|open|close|drive|ride|sing|swim|rain|snow)\b'
    replace: '\1\2 \3s'
    case_sensitive: true
    explanation: "HE-SHE-IT adds -s: he works."
    guide_ref: "§KK 23, §1.3.5"

  - id: 24
    category: verb_agreement
    tier: deterministic
    severity: low
    wrong: "She don't know."
    right: "She doesn't know."
    find: '\b(he|she|it) don''t\b'
    replace: '\1 doesn''t'
    explanation: "he/she/it + doesn't (not don't)."
    guide_ref: "§KK 24, §E"

  - id: 25
    category: tense_aspect
    tier: deterministic
    severity: medium
    wrong: "I work here since 2019."
    right: "I have worked here since 2019."
    find: '\bI work (here|there) since\b'
    replace: 'I have worked \1 since'
    explanation: "'since' + still true today → have worked (arrow touching today)."
    guide_ref: "§KK 25, §1.3.8, §D"

  - id: 26
    category: tense_aspect
    tier: deterministic
    severity: low
    wrong: "I am knowing the answer."
    right: "I know the answer."
    find: '\b(I am|I''m) knowing\b'
    replace: 'I know'
    explanation: "'Know' never takes -ing: I know."
    guide_ref: "§KK 26, §D stative verbs"

  - id: 27
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "I am agree."
    right: "I agree."
    find: '\b(I am|I''m) agree\b'
    replace: 'I agree'
    explanation: "'Agree' is a verb, not an adjective: I agree."
    guide_ref: "§KK 27"

  - id: 28
    category: articles
    tier: deterministic
    severity: low
    wrong: "He is teacher."
    right: "He is a teacher."
    find: '\b(he|she) is (teacher|geologist|doctor|nurse|lawyer|student)\b(?! of)'
    replace: '\1 is a \2'
    explanation: "Job words need 'a': he is a teacher."
    guide_ref: "§KK 28, §1.3.7"

  - id: 29
    category: tense_aspect
    tier: contextual
    severity: medium
    wrong: "Yesterday I go to site."
    right: "Yesterday I went to the site."
    explanation: "'Yesterday' = past, so the verb is past: went."
    guide_ref: "§KK 29, §D"

  - id: 30
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "I have went there."
    right: "I have gone there."
    find: '\b(have|has|had) went\b'
    replace: '\1 gone'
    explanation: "have/has/had + gone (third form), never 'went'."
    guide_ref: "§KK 30, §D"

  - id: 31
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "The report was wrote."
    right: "The report was written."
    find: '\b(was|were|been|is|are|being) wrote\b'
    replace: '\1 written'
    explanation: "Passive uses the third form: was written."
    guide_ref: "§KK 31, §W"

  - id: 32
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "The accident was happened."
    right: "The accident happened."
    find: '\b(was|were) happened\b(?! upon)'
    replace: 'happened'
    explanation: "'Happen' has no passive: the accident happened."
    guide_ref: "§KK 32, §W common errors"

  - id: 33
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "I didn't went."
    right: "I didn't go."
    find: '\b(didn''t|did not|don''t|doesn''t|does not|do not) went\b'
    replace: '\1 go'
    explanation: "After did/didn't the verb goes back to base form: didn't go."
    guide_ref: "§KK 33, §E"

  - id: 34
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "He can to swim."
    right: "He can swim."
    find: '(^|[.!?]\s+)(I|He|She|We|They|You|It) (can|must|should|might) to (\w+)'
    replace: '\1\2 \3 \4'
    case_sensitive: true
    explanation: "After can/must/should: no 'to'. He can swim."
    guide_ref: "§KK 34, §F"

  - id: 35
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "He cans drive."
    right: "He can drive."
    find: '\b(he|she|it) cans (drive|go|swim|read|write|speak|work|come|play|walk|run|sing|cook|help)\b'
    replace: '\1 can \2'
    explanation: "Modal verbs never take -s: he can."
    guide_ref: "§KK 35, §F"

  - id: 36
    category: verb_form
    tier: deterministic
    severity: low
    wrong: "I enjoy to work here."
    right: "I enjoy working here."
    find: '\benjoy(s|ed)? to (work|go|play|read|learn|study|walk|watch|cook|sleep|eat|draw)\b'
    replace: 'enjoy\1 \2ing'
    explanation: "enjoy + -ing: enjoy working."
    guide_ref: "§KK 36, §O"

  - id: 37
    category: verb_form
    tier: deterministic
    severity: low
    wrong: "I look forward to hear from you."
    right: "I look forward to hearing from you."
    find: '\blook(s|ing|ed)? forward to (hear|see|meet|discuss|learn|work|read|visit|talk)\b'
    replace: 'look\1 forward to \2ing'
    explanation: "'to' here is a preposition → -ing: look forward to hearing."
    guide_ref: "§KK 37, §O the one reliable rule"

  - id: 38
    category: verb_form
    tier: deterministic
    severity: medium
    wrong: "He suggested me to go."
    right: "He suggested that I go."
    find: '\bsuggest(s|ed)? me to (\w+)'
    replace: 'suggest\1 that I \2'
    explanation: "suggest + that + person: he suggested that I go."
    guide_ref: "§KK 38, §O"

  - id: 39
    category: tense_aspect
    tier: contextual
    severity: medium
    wrong: "If it will rain, we stop."
    right: "If it rains, we will stop."
    explanation: "No 'will' after 'if': if it rains, we will stop."
    guide_ref: "§KK 39, §S two absolute rules"

  - id: 40
    category: word_choice
    tier: deterministic
    severity: high
    wrong: "I am interesting in geology."
    right: "I am interested in geology."
    find: '\bI am interesting in\b(?! (that|my|his|her|their|some|many)\b)'
    replace: 'I am interested in'
    case_sensitive: true
    explanation: "You feel interestED; the thing is interestING."
    guide_ref: "§KK 40"

  # ── Word order (41–48) ───────────────────────────────────────────

  - id: 41
    category: word_order
    tier: contextual
    severity: high
    wrong: "I the samples analysed."
    right: "I analysed the samples."
    explanation: "English builds forwards: person → action → thing."
    guide_ref: "§KK 41, §1.3.1"

  - id: 42
    category: modifier_placement
    tier: contextual
    severity: low
    wrong: "He examined carefully the core."
    right: "He examined the core carefully."
    explanation: "Never put an adverb between the verb and its object."
    guide_ref: "§KK 42, §T adverb placement"

  - id: 43
    category: word_order
    tier: contextual
    severity: medium
    wrong: "We drilled last week three holes."
    right: "We drilled three holes last week."
    explanation: "Time words go at the end (or the very start), not in the middle."
    guide_ref: "§KK 43, §T SVOMPT"

  - id: 44
    category: relative_clauses
    tier: contextual
    severity: medium
    wrong: "The yesterday drilled hole was deep."
    right: "The hole we drilled yesterday was deep."
    explanation: "Describe AFTER the noun: the hole that we drilled yesterday."
    guide_ref: "§KK 44, §1.3.9, §V"

  - id: 45
    category: modifier_placement
    tier: contextual
    severity: low
    wrong: "a wooden black old box"
    right: "an old black wooden box"
    explanation: "Adjective order: opinion–size–age–shape–colour–origin–material."
    guide_ref: "§KK 45, §T adjective order"

  - id: 46
    category: modifier_placement
    tier: contextual
    severity: low
    wrong: "I always am careful."
    right: "I am always careful."
    explanation: "Frequency adverbs go AFTER 'be': I am always careful."
    guide_ref: "§KK 46, §T"

  - id: 47
    category: modifier_placement
    tier: contextual
    severity: low
    wrong: "Always I check the data."
    right: "I always check the data."
    explanation: "Frequency adverbs go before the main verb: I always check."
    guide_ref: "§KK 47, §T"

  - id: 48
    category: modifier_placement
    tier: contextual
    severity: low
    wrong: "Very I like it."
    right: "I like it very much."
    explanation: "'Very much' goes at the end: I like it very much."
    guide_ref: "§KK 48, §T"

  # ── Prepositions (49–62) ─────────────────────────────────────────

  - id: 49
    category: topic_fronting
    tier: contextual
    severity: medium
    wrong: "About the report, it's late."
    right: "The report is late."
    explanation: "English can't announce a topic with 'about' — make it the subject."
    guide_ref: "§KK 49, §C, §1.3.3"

  - id: 50
    category: prepositions
    tier: deterministic
    severity: medium
    wrong: "We arrived to the site."
    right: "We arrived at the site."
    find: '\barriv(ed|es|ing|e) to the\b(?! (applause|cheers|sound|news|smell|sight|strains|tune|aroma))'
    replace: 'arriv\1 at the'
    explanation: "arrive AT a place: arrived at the site."
    guide_ref: "§KK 50, §R classic errors"

  - id: 51
    category: collocation
    tier: deterministic
    severity: low
    wrong: "Let's discuss about it."
    right: "Let's discuss it."
    find: '\b(discuss(?:es|ed|ing)?) about\b'
    replace: '\1'
    explanation: "'Discuss' takes no preposition: discuss it."
    guide_ref: "§KK 51, §Q"

  - id: 52
    category: collocation
    tier: deterministic
    severity: medium
    wrong: "Explain me the data."
    right: "Explain the data to me."
    find: '\b([Ee]xplain(?:s|ed)?) (me|us) (the|this|that) (\w+)'
    replace: '\1 \3 \4 to \2'
    explanation: "explain something TO someone: explain the data to me."
    guide_ref: "§KK 52, §Q"

  - id: 53
    category: prepositions
    tier: deterministic
    severity: low
    wrong: "It depends of the grade."
    right: "It depends on the grade."
    find: '\bdepend(s|ed|ing)? of\b'
    replace: 'depend\1 on'
    explanation: "depends ON — learn verb + preposition as one chunk."
    guide_ref: "§KK 53, §R dependent prepositions"

  - id: 54
    category: collocation
    tier: deterministic
    severity: low
    wrong: "I listen music every day."
    right: "I listen to music every day."
    find: '\blisten(s|ed|ing)? (music|radio|podcasts|songs)\b'
    replace: 'listen\1 to \2'
    explanation: "listen TO music."
    guide_ref: "§KK 54, §Q"

  - id: 55
    category: prepositions
    tier: deterministic
    severity: low
    wrong: "She is married with him."
    right: "She is married to him."
    find: '\bmarried with (him|her|me)(?=\s*[.,!?;]|$| for\b| since\b| last\b| in\b)'
    replace: 'married to \1'
    explanation: "married TO a person."
    guide_ref: "§KK 55, §R classic errors"

  - id: 56
    category: prepositions
    tier: deterministic
    severity: low
    wrong: "I read it in the internet."
    right: "I read it on the internet."
    find: '\bin the internet\b(?! (age|era|world|economy|business|of))'
    replace: 'on the internet'
    explanation: "ON the internet (like a surface)."
    guide_ref: "§KK 56, §R"

  - id: 57
    category: prepositions
    tier: contextual
    severity: low
    wrong: "I'm good in English."
    right: "I'm good at English."
    explanation: "good AT something."
    guide_ref: "§KK 57, §R dependent prepositions"

  - id: 58
    category: comparatives
    tier: contextual
    severity: low
    wrong: "different than"
    right: "different from"
    explanation: "British English prefers 'different from' ('than' is common in American)."
    guide_ref: "§KK 58, §R"

  - id: 59
    category: prepositions
    tier: contextual
    severity: low
    wrong: "The deposit consists in three units."
    right: "The deposit consists of three units."
    explanation: "consists OF parts ('consist in' exists but means something else)."
    guide_ref: "§KK 59, §R"

  - id: 60
    category: prepositions
    tier: deterministic
    severity: low
    wrong: "He is responsible of safety."
    right: "He is responsible for safety."
    find: '\bresponsible of\b'
    replace: 'responsible for'
    explanation: "responsible FOR something."
    guide_ref: "§KK 60, §R dependent prepositions"

  - id: 61
    category: prepositions
    tier: deterministic
    severity: low
    wrong: "We started on July."
    right: "We started in July."
    find: '\bon (January|February|March|April|June|July|August|September|October|November|December)\b(?! \d|,? the)'
    replace: 'in \1'
    explanation: "IN a month, ON a date: in July, on July 4."
    guide_ref: "§KK 61, §R at→on→in"

  - id: 62
    category: collocation
    tier: deterministic
    severity: low
    wrong: "He entered into the room."
    right: "He entered the room."
    find: '\benter(s|ed|ing)? into (the|a) (room|building|office|house|hall|kitchen|mine|classroom)\b'
    replace: 'enter\1 \2 \3'
    explanation: "'Enter' takes no preposition: enter the room."
    guide_ref: "§KK 62, §Q"

  # ── Pronouns and determiners (63–70) ─────────────────────────────

  - id: 63
    category: pronoun_gender
    tier: deterministic
    severity: medium
    wrong: "My wife, he works in a school."
    right: "My wife, she works in a school."
    find: '\b(wife|mother|sister|daughter|grandmother|aunt|girlfriend), he (works|likes|goes|comes|wants|lives|loves|teaches|cooks)\b'
    replace: '\1, she \2'
    explanation: "wife/mother/sister → she. («тэр» hides this choice; English forces it.)"
    guide_ref: "§KK 63, §1.3.4"

  - id: 64
    category: determiners
    tier: deterministic
    severity: low
    wrong: "Its ready."
    right: "It's ready."
    find: '(^|[.!?]\s+)Its (ready|done|fine|okay|late|good|important)(?=\s*[.,!?]|$)'
    replace: '\1It''s \2'
    case_sensitive: true
    explanation: "it's = it is; its = эзэмшил (possessive)."
    guide_ref: "§KK 64, §Y its vs it's"

  - id: 65
    category: determiners
    tier: deterministic
    severity: low
    wrong: "the deposit and it's grade"
    right: "the deposit and its grade"
    find: '\bit''s (grade|color|colour|size|shape|name|value|depth|thickness|length|width|own|price|weight)\b(?! [A-Z])'
    replace: 'its \1'
    case_sensitive: true
    explanation: "Possessive is 'its' with no apostrophe: its grade."
    guide_ref: "§KK 65, §Y its vs it's"

  - id: 66
    category: determiners

# Everyday conversations — how people actually talk, simplified.
# Curated; text-only (no audio by design — stress marks are written).
# Each dialogue: real-life lines EN + MN, key phrases with stress, and one
# "choose the best reply" practice.
# ⚠ Mongolian strings need native-speaker verification before shipping.

version: 1

dialogues:
  - id: greetings
    level: A1
    title_en: "Saying hello"
    title_mn: "Мэндчилгээ"
    situation: "Two colleagues meet in the morning."
    lines:
      - {sp: "A", en: "Morning, Bold! How are you?", mn: "Өглөөний мэнд, Болд оо! Сайн уу?"}
      - {sp: "B", en: "Good, thanks. And you?", mn: "Сайн, баярлалаа. Та сайн уу?"}
      - {sp: "A", en: "Not bad. Busy day today?", mn: "Гайгүй ээ. Өнөөдөр завгүй юу?"}
      - {sp: "B", en: "Pretty busy — we have a meeting at ten.", mn: "Нэлээд завгүй — арван цагт хуралтай."}
      - {sp: "A", en: "Good luck! See you at lunch.", mn: "Амжилт! Үдийн хоолон дээр уулзъя."}
      - {sp: "B", en: "See you!", mn: "Уулзъя!"}
    key_phrases:
      - {en: "How are you?", note: "Answer is short: 'Good, thanks. And you?' — nobody gives a real report."}
      - {en: "Not bad", note: "= сайн байна. Very common, friendly."}
      - {en: "See you!", note: "Casual goodbye between people who meet often."}
    practice:
      situation: "A colleague says: 'Morning! How are you?' — best reply?"
      options:
        - {text: "Good, thanks. And you?", correct: true, why: "Short + return the question — that is the whole game."}
        - {text: "I am fine thank you and how are you my friend today.", correct: false, why: "Too long and formal — textbook English, not real life."}
        - {text: "Yes.", correct: false, why: "'How are you?' needs a feeling word, not yes/no."}

  - id: introductions
    level: A1
    title_en: "Meeting someone new"
    title_mn: "Шинэ хүнтэй танилцах"
    situation: "First day with a new team member."
    lines:
      - {sp: "A", en: "Hi, I'm Sarah. I don't think we've met.", mn: "Сайн уу, би Сара. Бид танилцаагүй юм шиг байна."}
      - {sp: "B", en: "Hi Sarah, I'm Bold. I'm an accountant in the finance team.", mn: "Сайн уу Сара, би Болд. Санхүүгийн багийн нягтлан."}
      - {sp: "A", en: "Nice to meet you, Bold. How long have you been here?", mn: "Танилцахад таатай байна, Болд. Энд ажиллаад удаж байна уу?"}
      - {sp: "B", en: "About three years. And you? What do you do?", mn: "Гурван жил орчим. Та? Ямар ажил хийдэг вэ?"}
      - {sp: "A", en: "I'm the new data engineer. Still finding my feet!", mn: "Би шинэ дата инженер. Дасаж л байна!"}
      - {sp: "B", en: "You'll be fine. Let me know if you need anything.", mn: "Зүгээр дасна аа. Юм хэрэгтэй бол хэлээрэй."}
    key_phrases:
      - {en: "I'm an accountant", note: "am + an — the two words Mongolian drops. Never 'I accountant'."}
      - {en: "What do you do?", note: "= Ямар ажил хийдэг вэ? (NOT 'What is your job?' — this is the natural version)"}
      - {en: "Nice to meet you", note: "Say it once, at the first meeting only."}
    practice:
      situation: "Someone asks: 'What do you do?' — best reply?"
      options:
        - {text: "I'm an accountant. I work in finance.", correct: true, why: "Job + one detail. Perfect shape."}
        - {text: "I am accountant.", correct: false, why: "Missing 'an' — job words need an article."}
        - {text: "I do many things.", correct: false, why: "'Things' says nothing — name the real job."}

  - id: shop
    level: A2
    title_en: "At the shop"
    title_mn: "Дэлгүүрт"
    situation: "Buying water and asking the price."
    lines:
      - {sp: "A", en: "Excuse me, do you have sparkling water?", mn: "Уучлаарай, хийжүүлсэн ус байгаа юу?"}
      - {sp: "B", en: "Yes, it's in the back, next to the juice.", mn: "Байгаа, ард талд, жүүсний хажууд."}
      - {sp: "A", en: "Thanks. How much is this one?", mn: "Баярлалаа. Энэ ямар үнэтэй вэ?"}
      - {sp: "B", en: "Two fifty.", mn: "Хоёр тавь (2.50)."}
      - {sp: "A", en: "I'll take two, please. Can I pay by card?", mn: "Хоёрыг авъя. Картаар төлж болох уу?"}
      - {sp: "B", en: "Sure. Tap here… all done. Have a good one!", mn: "Болно оо. Энд уншуулна уу… боллоо. Сайхан өдөр болоорой!"}
    key_phrases:
      - {en: "Excuse me…", note: "Opens ANY question to a stranger. Never start with the bare question."}
      - {en: "How much is this?", note: "= Энэ ямар үнэтэй вэ?"}
      - {en: "I'll take two", note: "'I'll take…' is the natural buying phrase — not 'I want two'."}
    practice:
      situation: "You want to know the price. Best question?"
      options:
        - {text: "Excuse me, how much is this?", correct: true, why: "Excuse me + the set phrase."}
        - {text: "What is the money of this?", correct: false, why: "Word-for-word translation — this phrase doesn't exist."}
        - {text: "Give me the price.", correct: false, why: "A bare command sounds rude in English (politeness lives in the phrasing)."}

  - id: directions
    level: A2
    title_en: "Asking the way"
    title_mn: "Зам асуух"
    situation: "Finding a pharmacy in an unfamiliar part of town."
    lines:
      - {sp: "A", en: "Excuse me, is there a pharmacy near here?", mn: "Уучлаарай, энд ойрхон эмийн сан байгаа юу?"}
      - {sp: "B", en: "Yes — go straight, then turn left at the bank.", mn: "Байгаа — чигээрээ яваад, банкан дээр зүүн тийш эргэ."}
      - {sp: "A", en: "Left at the bank… is it far?", mn: "Банкан дээр зүүн тийш… хол уу?"}
      - {sp: "B", en: "No, about five minutes on foot. It's on your right, next to a café.", mn: "Үгүй, явганаар таван минут орчим. Баруун гар талд, кафений хажууд."}
      - {sp: "A", en: "Great, thanks a lot!", mn: "Их баярлалаа!"}
      - {sp: "B", en: "No problem!", mn: "Зүгээр зүгээр!"}
    key_phrases:
      - {en: "Is there a … near here?", note: "THERE IS = байна. The question form for finding anything."}
      - {en: "turn left / turn right", note: "зүүн / баруун тийш эргэх"}
      - {en: "on your right", note: "ON for sides: on the right, on the left."}
    practice:
      situation: "You repeat the directions to check you understood. Best way?"
      options:
        - {text: "So — straight, then left at the bank?", correct: true, why: "Repeating back short is exactly what natives do to confirm."}
        - {text: "I understood everything perfectly.", correct: false, why: "Saying you understood ≠ checking you understood."}
        - {text: "Again.", correct: false, why: "One-word commands sound rude — use 'Sorry, could you say that again?'"}

  - id: phone_repeat
    level: A2
    title_en: "On the phone — asking to repeat"
    title_mn: "Утсаар — дахин хэлүүлэх"
    situation: "A bad line. THE most important skill for real conversations."
    lines:
      - {sp: "A", en: "Hi, this is Bold from the sales team.", mn: "Сайн уу, борлуулалтын багийн Болд байна."}
      - {sp: "B", en: "Hi Bold. The documents arrive on the… (unclear) …day.", mn: "Сайн уу Болд. Бичиг баримтууд … (тодорхойгүй) … өдөр ирнэ."}
      - {sp: "A", en: "Sorry, could you say that again? The line is bad.", mn: "Уучлаарай, дахин хэлж өгөхгүй юу? Холбоо муу байна."}
      - {sp: "B", en: "Sure — the documents arrive on Thursday.", mn: "Тэгье — бичиг баримтууд пүрэв гарагт ирнэ."}
      - {sp: "A", en: "Thursday, got it. Could you speak a little slower, please? English is my second language.", mn: "Пүрэв, ойлголоо. Жаахан удаан ярьж болох уу? Англи хэл миний хоёр дахь хэл."}
      - {sp: "B", en: "Of course, no problem at all.", mn: "Мэдээж, ямар ч асуудалгүй."}
    key_phrases:
      - {en: "Sorry, could you say that again?", note: "Use it PROUDLY. Native speakers say it constantly too."}
      - {en: "Could you speak a little slower?", note: "Nobody minds. It shows confidence, not weakness."}
      - {en: "Got it", note: "= ойлголоо. Confirms you understood."}
    practice:
      situation: "You didn't understand. Best response?"
      options:
        - {text: "Sorry, could you say that again?", correct: true, why: "The single most useful sentence in spoken English."}
        - {text: "(Say nothing and hope)", correct: false, why: "Guessing builds wrong information — asking builds trust."}
        - {text: "What?!", correct: false, why: "'What?' alone sounds annoyed. Add sorry + could you."}

  - id: making_plans
    level: B1
    title_en: "Making plans with a friend"
    title_mn: "Найзтайгаа болзох"
    situation: "Arranging to meet at the weekend."
    lines:
      - {sp: "A", en: "Hey, are you free on Saturday?", mn: "Хөөе, бямбад завтай юу?"}
      - {sp: "B", en: "Saturday… I think so. What did you have in mind?", mn: "Бямба… завтай байх аа. Юу бодож байгаа юм?"}
      - {sp: "A", en: "There's a new place near the square. Fancy trying it?", mn: "Талбайн ойролцоо шинэ газар нээгдсэн. Очиж үзэх үү?"}
      - {sp: "B", en: "Sounds good. What time works for you?", mn: "Сайхан санаа. Хэдэн цагт тохиромжтой вэ?"}
      - {sp: "A", en: "How about one o'clock? We could walk after.", mn: "Нэг цагт ямар вэ? Дараа нь алхаж болно."}
      - {sp: "B", en: "Perfect. If something comes up, I'll text you.", mn: "Болно. Ямар нэг зүйл гарвал мессеж бичье."}
    key_phrases:
      - {en: "Are you free on Saturday?", note: "free = завтай. ON + day."}
      - {en: "How about one o'clock?", note: "'How about…?' — the softest way to suggest anything."}
      - {en: "If something comes up…", note: "= Ямар нэг зүйл гарвал… ('comes up', present — no 'will' after if!)"}
    practice:
      situation: "You want to suggest 2 pm. Best way?"
      options:
        - {text: "How about two o'clock?", correct: true, why: "Soft suggestion — leaves room for the other person."}
        - {text: "We will meet at two o'clock.", correct: false, why: "A decision, not a suggestion — sounds like an order."}
        - {text: "If you will be free at two, we meet.", correct: false, why: "No 'will' after 'if': if you're free at two…"}

  - id: work_meeting
    level: B1
    title_en: "Speaking up in a meeting"
    title_mn: "Хурал дээр санал хэлэх"
    situation: "A short project meeting; you need to update and disagree politely."
    lines:
      - {sp: "A", en: "Bold, could you give us a quick update on the project?", mn: "Болд оо, төслийн талаар товч мэдээлэл өгөхгүй юу?"}
      - {sp: "B", en: "Sure. We've finished the first draft — the final numbers come in on Friday.", mn: "Тэгье. Эхний ноорог дууссан — эцсийн тоо баасанд ирнэ."}
      - {sp: "A", en: "Great. So we can send it to the client on Monday?", mn: "Сайн байна. Тэгэхээр даваад захиалагч руу явуулж болох нь ээ?"}
      - {sp: "B", en: "I'm not sure that works, actually — the numbers may not be checked. Could we say Wednesday to be safe?", mn: "Бүтэхгүй байж магадгүй — тоог шалгаж амжаагүй байж мэднэ. Аюулгүй талаас нь лхагва гэж тохирох уу?"}
      - {sp: "A", en: "Fair point. Wednesday it is.", mn: "Зөв санал. Лхагва болгоё."}
      - {sp: "B", en: "Thanks. I'll send a short summary after the meeting.", mn: "Баярлалаа. Хурлын дараа товч мэдээ явуулъя."}
    key_phrases:
      - {en: "I'm not sure that works, actually", note: "How natives say NO politely — never a bare 'No, impossible'."}
      - {en: "Could we say Wednesday?", note: "Suggesting a change as a question keeps everyone comfortable."}
      - {en: "Fair point", note: "= Зөв юм байна. Accepting someone's argument gracefully."}
    practice:
      situation: "You disagree with a date. Best way to say it?"
      options:
        - {text: "I'm not sure that works — could we say Wednesday?", correct: true, why: "Soft no + alternative = professional disagreement."}
        - {text: "No. That is wrong.", correct: false, why: "Bare 'no' burns goodwill — English wraps disagreement in softeners."}
        - {text: "(Stay silent and worry)", correct: false, why: "Silence = agreement in meetings. Speak, softly."}

  - id: family
    level: A1
    title_en: "Talking about family"
    title_mn: "Гэр бүлийн тухай ярих"
    situation: "A new friend asks about your family."
    lines:
      - {sp: "A", en: "Do you have brothers or sisters?", mn: "Танд ах дүү бий юу?"}
      - {sp: "B", en: "Yes, one brother and two sisters. And you?", mn: "Тийм, нэг ах, хоёр эгч дүү. Та?"}
      - {sp: "A", en: "Just one sister. She lives in Darkhan.", mn: "Ганц эгчтэй. Тэр Дарханд амьдардаг."}
      - {sp: "B", en: "Nice! Do you see her often?", mn: "Сайхан юм! Байнга уулздаг уу?"}
      - {sp: "A", en: "Every summer. My parents live there too.", mn: "Зун болгон. Аав ээж маань бас тэнд амьдардаг."}
      - {sp: "B", en: "Family time is the best time.", mn: "Гэр бүлийн цаг хамгийн сайхан."}
    key_phrases:
      - {en: "Do you have…?", note: "The A1 question machine: Do you have brothers? Do you have time?"}
      - {en: "She lives in…", note: "he/she + livES — the -s that Mongolian never asks for."}
      - {en: "And you?", note: "Two words that keep every conversation alive."}
    practice:
      situation: "Someone asks: 'Do you have brothers or sisters?' Best reply?"
      options:
        - {text: "Yes, one brother. And you?", correct: true, why: "Answer + return the question — conversation is ping-pong."}
        - {text: "Yes.", correct: false, why: "One word ends the game. Add a detail and 'And you?'"}
        - {text: "My family is a difficult and long story from history.", correct: false, why: "Too much for small talk — keep A1 answers light."}

  - id: doctor
    level: A2
    title_en: "At the doctor"
    title_mn: "Эмчид үзүүлэх"
    situation: "Describing a simple illness."
    lines:
      - {sp: "A", en: "So, what seems to be the problem?", mn: "За, юу болоод байна вэ?"}
      - {sp: "B", en: "I have a sore throat and a headache. It started two days ago.", mn: "Хоолой өвдөж, толгой өвдөж байна. Хоёр хоногийн өмнө эхэлсэн."}
      - {sp: "A", en: "Any fever?", mn: "Халуурч байна уу?"}
      - {sp: "B", en: "A little, last night. Around thirty-eight.", mn: "Өчигдөр шөнө жаахан. Гучин найм орчим."}
      - {sp: "A", en: "It looks like a cold. Rest, warm drinks, and take this twice a day.", mn: "Ханиад шиг байна. Амарч, бүлээн юм ууж, үүнийг өдөрт хоёр удаа ууна уу."}
      - {sp: "B", en: "Twice a day, got it. Thank you, doctor.", mn: "Өдөрт хоёр удаа, ойлголоо. Баярлалаа, эмч ээ."}
    key_phrases:
      - {en: "I have a sore throat / a headache", note: "Illness = I HAVE + a + body problem. Never 'my throat is pain'."}
      - {en: "It started two days ago", note: "ago = өмнө; the past-simple marker doctors always ask for."}
      - {en: "twice a day", note: "once / twice / three times a day — өдөрт нэг/хоёр/гурван удаа."}
    practice:
      situation: "The doctor asks what's wrong. Best answer?"
      options:
        - {text: "I have a headache. It started yesterday.", correct: true, why: "Symptom + when it started — exactly what a doctor needs."}
        - {text: "My head is pain.", correct: false, why: "'Pain' is a noun: I have a pain / my head hurts / I have a headache."}
        - {text: "I am sick of everything.", correct: false, why: "'Sick of' means annoyed, not ill! Say 'I feel sick.'"}

  - id: taxi
    level: A2
    title_en: "Taking a taxi"
    title_mn: "Такси авах"
    situation: "Getting across town with a talkative driver."
    lines:
      - {sp: "A", en: "Where to?", mn: "Хаашаа явах вэ?"}
      - {sp: "B", en: "The central library, please. How long will it take?", mn: "Төв номын сан руу. Хэр удах вэ?"}
      - {sp: "A", en: "Twenty minutes, maybe more — traffic is heavy today.", mn: "Хорин минут, магадгүй илүү — өнөөдөр замын хөдөлгөөн их байна."}
      - {sp: "B", en: "No problem. Could you drop me at the main entrance?", mn: "Зүгээр. Гол хаалган дээр буулгаж өгөхгүй юу?"}
      - {sp: "A", en: "Sure. Here we are — that'll be eight thousand.", mn: "Тэгье. Ирлээ — найман мянга болно."}
      - {sp: "B", en: "Keep the change. Have a good day!", mn: "Хариултаа аваарай. Сайхан өдөр болоорой!"}
    key_phrases:
      - {en: "How long will it take?", note: "TAKE = хугацаа зарцуулах: It takes 20 minutes."}
      - {en: "Could you drop me at…?", note: "drop me at = буулгаж өгөх. Polite request shape again."}
      - {en: "That'll be eight thousand", note: "How sellers say the price — 'that will be…'"}
    practice:
      situation: "You want to know the journey time. Best question?"
      options:
        - {text: "How long will it take?", correct: true, why: "The fixed phrase with TAKE for time."}
        - {text: "How many time we go?", correct: false, why: "Time here is uncountable, and the verb is TAKE: how long will it take?"}
        - {text: "When we are there?", correct: false, why: "Needs do-support and 'arrive': When do we arrive?"}

  - id: complaint
    level: B1
    title_en: "Complaining politely"
    title_mn: "Эелдэг гомдол мэдүүлэх"
    situation: "Your order arrived wrong. Getting it fixed without a fight."
    lines:
      - {sp: "A", en: "Excuse me, I'm afraid there's a problem with my order.", mn: "Уучлаарай, миний захиалгад асуудал гарсан бололтой."}
      - {sp: "B", en: "Oh, I'm sorry to hear that. What happened?", mn: "Өө, уучлаарай. Юу болсон бэ?"}
      - {sp: "A", en: "I ordered the chicken soup, but this is beef. And the bill charges for both.", mn: "Би тахианы шөл захиалсан ч энэ үхрийн мах байна. Тооцоонд хоёуланг нь бичсэн байна."}
      - {sp: "B", en: "You're right, that's our mistake. I'll bring the correct dish and fix the bill.", mn: "Таны зөв, бидний алдаа байна. Зөв хоолыг авчирч, тооцоог засъя."}
      - {sp: "A", en: "Thanks, I appreciate it.", mn: "Баярлалаа, талархаж байна."}
      - {sp: "B", en: "And the dessert is on us today.", mn: "Өнөөдөр амттанг манайх үнэгүй өгье."}
    key_phrases:
      - {en: "I'm afraid there's a problem…", note: "'I'm afraid' = complaint airbag. It softens whatever follows."}
      - {en: "I ordered X, but this is Y", note: "Fact, fact — no anger needed. Facts win complaints."}
      - {en: "I appreciate it", note: "Warmer than 'thanks' — perfect after someone fixes a mistake."}
    practice:
      situation: "Your soup is wrong. Open the complaint how?"
      options:
        - {text: "Excuse me, I'm afraid there's a problem with my order.", correct: true, why: "Soft opener → cooperative waiter. English complaints start apologetically."}
        - {text: "This is wrong food! Change it!", correct: false, why: "Wins the argument, loses the room. Bare commands read as aggression."}
        - {text: "(Eat it silently and never return)", correct: false, why: "The most common learner choice — and the only truly wrong one."}

  - id: hobbies
    level: B1
    title_en: "Weekends and hobbies"
    title_mn: "Амралтын өдөр ба хобби"
    situation: "Small talk that builds friendships."
    lines:
      - {sp: "A", en: "Did you get up to anything at the weekend?", mn: "Амралтын өдрөөр юу хийв?"}
      - {sp: "B", en: "Not much — I went hiking with my cousin. We've been doing it every month lately.", mn: "Онц юмгүй — үеэлтэйгээ ууланд явлаа. Сүүлийн үед сар болгон явж байгаа."}
      - {sp: "A", en: "Nice! Whereabouts?", mn: "Гоё! Хаагуур?"}
      - {sp: "B", en: "Near the river, about an hour out. You should come along next time.", mn: "Голын ойролцоо, нэг цаг орчим зайтай. Дараагийн удаад та ирээрэй."}
      - {sp: "A", en: "I'd love to. I've been meaning to get outdoors more.", mn: "Дуртайяа. Гадаа илүү их гарах гэж бодож л явдаг юм."}
      - {sp: "B", en: "It's a deal, then. I'll text you the date.", mn: "Тэгвэл тохирлоо. Өдрийг нь мессежээр хэлье."}
    key_phrases:
      - {en: "Did you get up to anything at the weekend?", note: "How natives really ask — not 'What did you do?'"}
      - {en: "I've been meaning to…", note: "= …хийе гэж бодож явдаг. Perfect continuous for a long intention."}
      - {en: "You should come along", note: "The friendly invitation — 'come along' = хамт ирэх."}
    practice:
      situation: "Someone invites you hiking and you want to go. Best reply?"
      options:
        - {text: "I'd love to. When were you thinking?", correct: true, why: "Enthusiasm + a practical question — the accepting formula."}
        - {text: "Yes. I will come.", correct: false, why: "Grammatical but flat — 'I'd love to' carries the warmth."}
        - {text: "Maybe, if I am not busy or tired or something.", correct: false, why: "Three escape doors in one sentence reads as 'no'."}

  - id: opinion
    level: C1
    title_en: "Giving your opinion in a discussion"
    title_mn: "Хэлэлцүүлэгт саналаа хэлэх"
    situation: "Disagreeing with the room — and being thanked for it."
    lines:
      - {sp: "A", en: "So we're all agreed the app should launch next month?", mn: "Тэгэхээр бид бүгд аппыг ирэх сард нээхээр санал нэгдэж байна уу?"}
      - {sp: "B", en: "Broadly, yes — though I'd push back on one point, if I may.", mn: "Ерөнхийдөө тийм — гэхдээ нэг зүйл дээр эсэргүүцэл хэлье, зөвшөөрвөл."}
      - {sp: "A", en: "Go ahead.", mn: "Хэлээрэй."}
      - {sp: "B", en: "From where I stand, the testing window looks optimistic. I'd sooner slip two weeks than launch with known bugs.", mn: "Миний харж байгаагаар тестийн хугацаа өөдрөг харагдаж байна. Мэдэгдэж буй алдаатай нээснээс хоёр долоо хоног хойшлуулсан нь дээр."}
      - {sp: "A", en: "That's a fair challenge. What would the two weeks buy us, concretely?", mn: "Зөв шүүмж байна. Хоёр долоо хоног бидэнд яг юу өгөх вэ?"}
      - {sp: "B", en: "A full regression pass and a margin for surprises. I'd rather be boring than sorry.", mn: "Бүрэн давтан шалгалт, гэнэтийн зүйлийн нөөц. Харамсахаар бол уйтгартай нь дээр."}
    key_phrases:
      - {en: "I'd push back on one point", note: "C1 disagreement: technical, impersonal, no 'you are wrong'."}
      - {en: "From where I stand…", note: "Frames opinion as perspective — leaves room for other views."}
      - {en: "I'd sooner X than Y", note: "= Y гэснээс X нь дээр. Elegant preference structure."}
    practice:
      situation: "The room agrees; you don't. Open with?"
      options:
        - {text: "Broadly yes — though I'd push back on one point, if I may.", correct: true, why: "Agree first, then one precise challenge — dissent that gets heard."}
        - {text: "Everyone here is wrong.", correct: false, why: "Even if true, the room stops listening at word three."}
        - {text: "(Agree aloud, complain later)", correct: false, why: "The meeting is where opinions count — corridors change nothing."}

  - id: presentation
    level: C1
    title_en: "Presenting and taking questions"
    title_mn: "Илтгэл тавьж, асуултад хариулах"
    situation: "The Q&A — where presentations are won or lost (guide §II)."
    lines:
      - {sp: "A", en: "…and that brings me to the end. I'm happy to take questions.", mn: "…ингээд төгсгөлд хүрлээ. Асуултаа асууна уу."}
      - {sp: "B", en: "Thanks. Your growth figures — how sensitive are they to the exchange rate?", mn: "Баярлалаа. Таны өсөлтийн тоо — ханшийн өөрчлөлтөд хэр мэдрэмтгий вэ?"}
      - {sp: "A", en: "Good question. Moderately — a ten percent swing moves the forecast by roughly three points. The details are in the appendix.", mn: "Сайн асуулт. Дунд зэрэг — арван хувийн хэлбэлзэл таамаглалыг гурван пункт орчим хөдөлгөнө. Дэлгэрэнгүй нь хавсралтад бий."}
      - {sp: "B", en: "And if I could follow up — what's the biggest risk you see?", mn: "Үргэлжлүүлж асуухад — таны харж буй хамгийн том эрсдэл юу вэ?"}
      - {sp: "A", en: "Honestly? Hiring speed. The model assumes we staff up by June, and that's the assumption I'd watch.", mn: "Үнэнээр хэлэхэд? Хүн авах хурд. Загвар зургадугаар сар гэхэд бүрэн бүрэлдэхүүнтэй болно гэж үзсэн — энэ таамаглалыг л ажиглах хэрэгтэй."}
      - {sp: "B", en: "Appreciate the straight answer.", mn: "Шулуухан хариултад баярлалаа."}
    key_phrases:
      - {en: "That brings me to the end", note: "The standard landing phrase — signals Q&A cleanly."}
      - {en: "Good question. / If I could follow up…", note: "Q&A rituals: buy a second to think, extend politely."}
      - {en: "That's the assumption I'd watch", note: "Naming your own weak point builds more trust than hiding it."}
    practice:
      situation: "You're asked something you can't fully answer. Best move?"
      options:
        - {text: "Good question — I don't have the exact figure here, but I'll send it to you today.", correct: true, why: "Honesty + a concrete follow-up beats bluffing every time."}
        - {text: "(Invent a number confidently)", correct: false, why: "One caught bluff and the whole presentation is doubted."}
        - {text: "Next question.", correct: false, why: "Dodging is visible — the room remembers the question you skipped."}

  - id: bad_news
    level: C2
    title_en: "Delivering bad news"
    title_mn: "Муу мэдээ хүргэх"
    situation: "Telling a client the deadline will slip — keeping the relationship."
    lines:
      - {sp: "A", en: "Thanks for making time. I wanted to talk to you before you saw it in the report.", mn: "Цаг гаргасанд баярлалаа. Тайланд гарахаас өмнө өөрөө хэлье гэж бодсон."}
      - {sp: "B", en: "That sounds ominous.", mn: "Сонсоход л муу юм болсон бололтой."}
      - {sp: "A", en: "There's no way to dress it up: we're going to miss the March deadline. Realistically we're looking at late April.", mn: "Яаж ч чимэглэх аргагүй: бид гуравдугаар сарын хугацааг алдана. Бодитоор дөрөвдүгээр сарын сүүл гэж харж байна."}
      - {sp: "B", en: "That's a serious slip. What happened?", mn: "Ноцтой хоцролт байна шүү. Юу болсон бэ?"}
      - {sp: "A", en: "Two suppliers failed us, and I'll own our part: we spotted it later than we should have. Here's what we're doing about it — and what I can offer you in return.", mn: "Хоёр нийлүүлэгч бидэнд гологдол өгсөн, мөн өөрсдийн бурууг хүлээе: бид байх ёстойгоос оройтож мэдсэн. Одоо ингэж засаж байна — хариуд нь танд үүнийг санал болгож чадна."}
      - {sp: "B", en: "I don't love the news, but I'll take the honesty. Walk me through the new plan.", mn: "Мэдээ нь таалагдахгүй ч үнэнч байдлыг нь үнэлье. Шинэ төлөвлөгөөг тайлбарлаж өгөөч."}
    key_phrases:
      - {en: "There's no way to dress it up", note: "Announcing directness — paradoxically, the politest way to deliver bad news."}
      - {en: "I'll own our part", note: "'Own' a mistake = responsibility language that saves relationships."}
      - {en: "Here's what we're doing about it", note: "Bad news must arrive WITH the plan — never alone."}
    practice:
      situation: "You must tell a client about a delay. Structure?"
      options:
        - {text: "Warn them personally, state it plainly, own your part, bring the fix.", correct: true, why: "The four-step bad-news formula — honesty plus a plan."}
        - {text: "Let them find it in the monthly report.", correct: false, why: "Discovered bad news costs double the trust of delivered bad news."}
        - {text: "Blame the suppliers for everything.", correct: false, why: "Even where true, pure blame reads as evasion — own your slice."}

  - id: indirect
    level: C2
    title_en: "Reading between the lines"
    title_mn: "Далд утгыг унших"
    situation: "British-style indirectness — what the words are NOT saying."
    lines:
      - {sp: "A", en: "So — what did you make of my proposal?", mn: "За — миний саналыг юу гэж бодов?"}
      - {sp: "B", en: "It's certainly… ambitious. There are some quite interesting ideas in there.", mn: "Лавтай яахав… том санаа юм. Дотор нь нэлээд сонирхолтой санаанууд байна."}
      - {sp: "A", en: "You hate it.", mn: "Танд таалагдаагүй байна шүү дээ."}
      - {sp: "B", en: "I wouldn't go that far. Let's say the budget section might benefit from another pass.", mn: "Тэгтлээ хэлэхгүй ээ. Төсвийн хэсэг дахин нэг нягтлахад гэмгүй гэж хэлье дээ."}
      - {sp: "A", en: "Meaning the numbers don't add up.", mn: "Өөрөөр хэлбэл тоо нийлэхгүй байна гэсэн үг."}
      - {sp: "B", en: "Meaning I'd love to see version two. With, perhaps, slightly braver honesty about the costs.", mn: "Өөрөөр хэлбэл хоёр дахь хувилбарыг харахыг хүсэж байна. Магадгүй зардлын талаар арай зоригтой үнэнч байдалтайгаар."}
    key_phrases:
      - {en: "certainly… ambitious / quite interesting", note: "⚠ In British English these often mean the OPPOSITE — praise this faint is criticism."}
      - {en: "might benefit from another pass", note: "= it needs rework. The conditional hides the verdict."}
      - {en: "I wouldn't go that far", note: "Soft disagreement with your interpretation — while confirming half of it."}
    practice:
      situation: "A British colleague calls your plan 'quite interesting, certainly ambitious'. They mean…?"
      options:
        - {text: "They have serious doubts and expect a revision.", correct: true, why: "Faint praise + 'ambitious' is classic coded criticism — ask what to improve."}
        - {text: "They love it and will approve it.", correct: false, why: "If they loved it you'd hear 'brilliant, let's do it' — enthusiasm is never this quiet."}
        - {text: "They were not listening.", correct: false, why: "The wording is too careful for inattention — coded language IS the message."}

  - id: job_interview
    level: B2
    title_en: "A job interview"
    title_mn: "Ажлын ярилцлага"
    situation: "The classic questions — and answers that sound confident, not memorized."
    lines:
      - {sp: "A", en: "Thanks for coming in. Tell me a little about yourself.", mn: "Хүрэлцэн ирсэнд баярлалаа. Өөрийнхөө тухай товч ярина уу."}
      - {sp: "B", en: "Sure. I've worked in customer service for five years, mostly leading small teams.", mn: "Тэгье. Би таван жил үйлчилгээний салбарт ажилласан, гол нь жижиг баг ахалж байсан."}
      - {sp: "A", en: "What would you say is your biggest strength?", mn: "Таны хамгийн том давуу тал юу гэж хэлэх вэ?"}
      - {sp: "B", en: "I'd say staying calm under pressure — last year we handled a system failure without losing a single client.", mn: "Дарамтад тайван байдаг гэж хэлнэ — өнгөрсөн жил системийн доголдлыг нэг ч үйлчлүүлэгч алдалгүй давсан."}
      - {sp: "A", en: "And why are you leaving your current job?", mn: "Одоогийн ажлаасаа яагаад гарч байгаа вэ?"}
      - {sp: "B", en: "I've learned a lot there, but I'm looking for more responsibility, and this role offers exactly that.", mn: "Тэндээс их зүйл сурсан ч илүү хариуцлагатай ажил хайж байгаа — энэ албан тушаал яг тийм боломж юм."}
    key_phrases:
      - {en: "I'd say…", note: "Softens any self-praise: 'I'd say my strength is…' — confident but not arrogant."}
      - {en: "I've worked in … for five years", note: "Present perfect + for/since — the interview tense (experience touching today)."}
      - {en: "I'm looking for more responsibility", note: "The polite reason for leaving — never criticise the old employer."}
    practice:
      situation: "Interviewer asks why you left your last job. Best answer?"
      options:
        - {text: "I've learned a lot, but I'm looking for a new challenge.", correct: true, why: "Positive about the past + forward-looking. The formula interviewers expect."}
        - {text: "My boss was terrible and the salary was small.", correct: false, why: "Criticising a past employer is the classic interview mistake in any culture."}
        - {text: "I don't know. I just want money.", correct: false, why: "Honest, maybe — but it answers a different question than the one asked."}

  - id: negotiating
    level: B2
    title_en: "Negotiating a price"
    title_mn: "Үнэ тохиролцох"
    situation: "Softening techniques (guide §JJ): disagree without a single hard 'no'."
    lines:
      - {sp: "A", en: "For this volume, the best we can do is 5,000 a month.", mn: "Энэ хэмжээнд сарын 5,000 бол бидний өгч чадах хамгийн сайн үнэ."}
      - {sp: "B", en: "I see. To be honest, that's a little higher than we had in mind.", mn: "Ойлголоо. Үнэнийг хэлэхэд, энэ бидний бодож байснаас арай өндөр байна."}
      - {sp: "A", en: "What figure were you thinking of?", mn: "Та ямар тоо бодож байсан бэ?"}
      - {sp: "B", en: "Somewhere around 4,000. Would you be open to that if we signed for a full year?", mn: "4,000 орчим. Бүтэн жилээр гэрээ хийвэл та үүнийг хүлээж авах уу?"}
      - {sp: "A", en: "With a yearly contract… we might be able to meet you in the middle. Say 4,500?", mn: "Жилийн гэрээтэй бол... дундуур нь тохирч магадгүй. 4,500 гэвэл?"}
      - {sp: "B", en: "That could work. Let me confirm with my team and get back to you tomorrow.", mn: "Болох байх. Багтайгаа зөвшилцөөд маргааш эргэж холбогдъё."}
    key_phrases:
      - {en: "a little higher than we had in mind", note: "'A little' + comparative = polite disagreement. Never 'too expensive!'"}
      - {en: "Would you be open to…?", note: "Softest way to propose — a question, not a demand."}
      - {en: "meet you in the middle", note: "= дундуур нь тохирох. The compromise idiom of every negotiation."}
    practice:
      situation: "Their price is too high for you. Best response?"
      options:
        - {text: "To be honest, that's a little higher than we had in mind.", correct: true, why: "Softened disagreement keeps the negotiation alive — English hides the 'no'."}
        - {text: "No. Too expensive. Give discount.", correct: false, why: "Bare commands burn the relationship — politeness lives in the phrasing."}
        - {text: "OK, we accept.", correct: false, why: "Accepting the first price is not negotiating — and 'Would you be open to…?' costs nothing."}

  - id: restaurant
    level: A2
    title_en: "At a restaurant"
    title_mn: "Ресторанд"
    situation: "Ordering food with a colleague."
    lines:
      - {sp: "A", en: "Hi! Are you ready to order?", mn: "Сайн уу! Захиалахад бэлэн үү?"}
      - {sp: "B", en: "Almost — what do you recommend?", mn: "Бараг — та юу санал болгох вэ?"}
      - {sp: "A", en: "The beef noodles are really popular.", mn: "Үхрийн махтай гоймон их эрэлттэй."}
      - {sp: "B", en: "I'll have that, please. And a green tea.", mn: "Тэгвэл түүнийг авъя. Бас ногоон цай."}
      - {sp: "A", en: "Anything else?", mn: "Өөр юм авах уу?"}
      - {sp: "B", en: "No, that's all, thanks. Could we get the bill after?", mn: "Үгүй, боллоо, баярлалаа. Дараа нь тооцоог авчирч өгөхгүй юу?"}
    key_phrases:
      - {en: "What do you recommend?", note: "The friendliest question in any restaurant."}
      - {en: "I'll have…", note: "The set phrase for ordering — not 'I want' and not 'give me'."}
      - {en: "Could we get the bill?", note: "= Тооцоо авах. Also common: 'the check' (US)."}
    practice:
      situation: "Ordering soup. Best sentence?"
      options:
        - {text: "I'll have the soup, please.", correct: true, why: "'I'll have… please' is exactly how everyone orders."}
        - {text: "I want soup.", correct: false, why: "Grammatical but blunt — 'I want' loses the politeness та carried."}
        - {text: "Soup me.", correct: false, why: "Not an English structure."}

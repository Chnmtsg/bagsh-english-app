# Word partners — prepositions and collocations (ADR-0014).
#
# The two things a Mongolian learner cannot work out from rules, and which
# both local courses spend pages on: which preposition a word takes, and which
# verb goes with which noun. `depend ON`, `interested IN`, `MAKE a mistake`,
# `DO homework`. There is no rule behind any of it — English simply decided,
# and the only way in is to meet the whole phrase enough times.
#
# This is why the taxonomy marks `prepositions` and `collocation` untreatable
# (ADR-0007): there is no rule to drill when the learner gets one wrong, so the
# error queue shows a natural alternative instead of a correction. That is
# about REPAIRING an error. Teaching the chunk in the first place is a
# different job, and this is it.
#
# Fields:
#   chunk    — the phrase as you would look it up: "depend on", "make a mistake"
#   answer   — the word the learner types, in the form the example uses (made,
#              not make). It must appear EXACTLY ONCE in the example, so the
#              blank is never ambiguous; a test enforces both.
#   example  — one sentence, written for this app
#   kind     — preposition | collocation
#   level    — A2 / B1 / B2
#   note     — only where Mongolian pulls the wrong way (unverified Mongolian,
#              like every bridge outside vocabulary.yaml)

version: 1

# Core everyday words — the GRADING list for the reading strand (ADR-0009).
#
# What this is: the words a graded text may use WITHOUT a gloss at each band.
# Every graded-reader series in the world has one of these; this is ours.
#
# What this is not: a level authority, a teaching list, or anything the word
# ladder consults. `knowledge/vocabulary.yaml` still decides what level a word
# is (ADR-0005), and it wins whenever the two disagree. Nothing here affects a
# learner's level, their deck, or any metric.
#
# Why it exists: neither of the other sources can grade everyday English. The
# curated deck is 120 cards. The CEFR frequency list is ranked over a corpus
# with heavy legal and governmental content — its own header warns it has no
# entry for bread, milk, eat or hungry, and it turns out to have none for
# wait, catch, apple, join, cover or pair either, while ranking `watch` at C1.
# A grader built on that would reject "I waited for the bus" as advanced.
#
# Rules for adding a word:
#   1. Add it only after `python scripts/validate_readings.py -v` has reported
#      it unknown in a real text. This list grows from evidence.
#   2. Put it at the band where a learner genuinely meets it, NOT the band that
#      makes your text pass. If a word is really above the text's level, the
#      answer is a gloss or a rewrite — that is the whole point of the check.
#   3. If it is a word worth *teaching* rather than assuming, it belongs in
#      vocabulary.yaml as a card instead, with stress, glosses and an example.
#   4. Inflections are handled in code (src/reading.py). List the base form.


     example: "Gold extraction starts next quarter."}
  - {word: equipment, stress: e-QUIP-ment, pos: noun, level: B1, deck: work,
     gloss_en: "tools and machines for a job", gloss_mn: "тоног төхөөрөмж",
     example: "The new equipment arrived at the site."}
  - {word: safety, stress: SAFE-ty, pos: noun, level: A2, deck: work,
     gloss_en: "being protected from danger", gloss_mn: "аюулгүй байдал",
     example: "Safety comes first in every operation."}
  - {word: grade, stress: GRADE, pos: noun, level: B1, deck: work,
     gloss_en: "how rich the ore is", gloss_mn: "агуулга",
     example: "The grade improves at depth."}
  - {word: fault, stress: FAULT, pos: noun, level: B1, deck: work,
     gloss_en: "a break in the rock where it moved", gloss_mn: "хагарал",
     example: "The fault runs across the whole license area."}
  - {word: vein, stress: VEIN, pos: noun, level: B1, deck: work,
     gloss_en: "a thin band of mineral in rock", gloss_mn: "судал",
     example: "The quartz vein carries visible gold."}

# General vocabulary — the level ladder (A1 → A2 → B1 → B2), 30 words each.
# For EVERYONE — no professional/domain words here (geology lives in
# vocabulary_geology.yaml as an optional desktop deck).
#
# Rules (guide §1.5, §1.3.12):
# - `stress` is MANDATORY (capitals = stressed syllable). A word learned
#   without its stress is learned wrong.
# - `gloss_en` is simple English; `gloss_mn` is Mongolian.
#   ⚠ Mongolian strings need native-speaker verification before shipping.
# - `example` must contain the word verbatim (the cloze quiz blanks it).
# - A learner "knows" a word after 2 correct answers on different days;
#   knowing all words of a level unlocks the next (ADR-0003 extension).
#
# Extend by curation only. Never let a model write into this file.


# Plain-English glosses, A1 band (ADR-0010).
#
# Why this file exists: the Coverage Check hands a learner a list of words they
# said they did not know, and until now the study list answered that with
# "look it up in a dictionary". An app that can tell you a word is missing and
# then cannot tell you what it means is doing half a job.
#
# House style for a gloss:
#   1. Simple English, using words from this band or an easier one. This is a
#      dictionary for someone whose English is small, not for a linguist.
#   2. Never circular: a gloss may not contain the word itself or its stem.
#      "to work: to do work" teaches nothing. A test enforces this.
#   3. Three to about twelve words. If it needs a paragraph, it needs a card in
#      vocabulary.yaml instead.
#   4. The most common meaning first. A second meaning goes after "; also".
#   5. English only. Mongolian comes from vocabulary.yaml where the word is
#      already a card — never written fresh here (the ADR-0006 rule).
#   6. Base forms only. `workers` finds `worker` finds `work` in code.


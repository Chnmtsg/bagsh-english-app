[project]
name = "bagsh-journal"
version = "0.1.0"
description = "Daily English journaling pipeline for Mongolian speakers (LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

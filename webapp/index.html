<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Багш — English for Mongolian speakers</title>
<meta name="description" content="Grammar and vocabulary trainer built for Mongolian speakers — lessons, games, spaced repetition. Works offline.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#1a1f2e">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header id="topbar">
  <span id="brand">Багш</span>
  <span id="statline"></span>
</header>

<main id="view"></main>

<nav id="tabs">

  <button data-tab="stats"   class="tab">🏅<span>Stats</span></button>

<script src="./app.js"></script>
